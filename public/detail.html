<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batafsil ma'lumot — Safar</title>
<meta name="description" content="Batafsil ma'lumotlar, telefon raqami, manzili va sayohatchilar sharhlari.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Leaflet.js -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<link rel="stylesheet" href="css/style.css?v=2.2">
<style>
  .slider-container {
    position: relative;
    width: 100%;
    height: 560px;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 24px;
    background: #111;
  }
  .slide-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    transition: opacity 0.4s ease;
  }
  .slide-img.active {
    display: block;
  }
  .slider-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(28,26,23,0.65);
    color: #fff;
    border: none;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: background 0.2s, transform 0.2s;
  }
  .slider-btn:hover {
    background: rgba(28,26,23,0.9);
    transform: translateY(-50%) scale(1.08);
  }
  .slider-btn.prev { left: 16px; }
  .slider-btn.next { right: 16px; }
  .slider-dots {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .slider-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .slider-dot.active {
    background: #ffffff;
    transform: scale(1.3);
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 36px;
    margin-bottom: 60px;
  }
  @media (max-width: 900px) {
    .detail-grid { grid-template-columns: 1fr; }
  }
  .host-card {
    background: var(--sand-deep);
    border: 1px solid var(--sand-dark);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .phone-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--turquoise);
    color: #ffffff;
    font-weight: 700;
    font-size: 17px;
    padding: 12px 20px;
    border-radius: 12px;
    text-decoration: none;
    transition: transform 0.2s, background 0.2s;
  }
  .phone-badge:hover {
    transform: translateY(-2px);
    background: var(--turquoise-deep);
  }
  .amenities-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0;
  }
  .amenity-chip {
    background: #ffffff;
    border: 1px solid var(--sand-dark);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
  }
  .reviews-box {
    margin-top: 40px;
    border-top: 1px solid var(--sand-dark);
    padding-top: 32px;
  }
  .review-item {
    background: #ffffff;
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 16px;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .add-review-form {
    background: var(--sand-deep);
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 24px;
    border: 1px solid var(--sand-dark);
  }
</style>
</head>
<body>

<div id="site-header"></div>

<main style="padding-top: 32px; padding-bottom: 80px;">
  <div class="container" id="detailContent">
    <div class="review-skeleton-card" style="height: 400px; margin-bottom: 24px;"></div>
    <div class="review-skeleton-card" style="height: 200px;"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/partials.js"></script>
<script src="js/i18n.js"></script>
<script>
const API = window.SAFAR_API_BASE || (location.protocol === "file:" ? "http://localhost:4000" : "");

function escapeHtml(str) {
  if (!str) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

const params = new URLSearchParams(window.location.search);
const itemType = params.get("type") || "stay"; // stay, food, place, craft
const itemId = params.get("id") || "1";

let currentSlide = 0;
let slideImages = [];
let autoSlideTimer = null;
let touchStartX = 0;
let touchEndX = 0;

function changeSlide(index) {
  if (!slideImages.length) return;
  currentSlide = (index + slideImages.length) % slideImages.length;
  document.querySelectorAll(".slide-img").forEach((img, i) => {
    img.classList.toggle("active", i === currentSlide);
  });
  document.querySelectorAll(".slider-dot").forEach((dot, i) => {
    dot.classList.toggle("active", i === currentSlide);
  });
}

function startAutoSlide() {
  stopAutoSlide();
  if (slideImages.length > 1) {
    autoSlideTimer = setInterval(() => {
      changeSlide(currentSlide + 1);
    }, 3500);
  }
}

function stopAutoSlide() {
  if (autoSlideTimer) {
    clearInterval(autoSlideTimer);
    autoSlideTimer = null;
  }
}

function setupTouchAndAutoSlide() {
  const sliderEl = document.querySelector(".slider-container");
  if (!sliderEl || slideImages.length <= 1) return;

  startAutoSlide();

  sliderEl.addEventListener("mouseenter", stopAutoSlide);
  sliderEl.addEventListener("mouseleave", startAutoSlide);

  sliderEl.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].screenX;
    stopAutoSlide();
  }, { passive: true });

  sliderEl.addEventListener("touchend", (e) => {
    touchEndX = e.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    if (diff < -40) {
      changeSlide(currentSlide + 1);
    } else if (diff > 40) {
      changeSlide(currentSlide - 1);
    }
    startAutoSlide();
  }, { passive: true });
}

async function loadDetail() {
  const container = document.getElementById("detailContent");
  let endpoint = `${API}/api/stays/${itemId}`;
  if (itemType === "food") endpoint = `${API}/api/foods/${itemId}`;
  if (itemType === "place") endpoint = `${API}/api/places/${itemId}`;
  if (itemType === "craft") endpoint = `${API}/api/crafts/${itemId}`;

  try {
    const res = await fetch(endpoint);
    const data = await res.json();
    const item = data.stay || data.food || data.place || data.craft;

    if (!item) {
      container.innerHTML = `<h2>Ma'lumot topilmadi</h2><a href="index.html" class="btn btn-primary">Bosh sahifaga qaytish</a>`;
      return;
    }

    const title = item.title || item.name;
    const city = item.city;
    const phone = item.phone || item.contactPhone || "+998 90 123 45 67";
    const ownerName = item.ownerName || item.masterName || item.bestPlace || "Mas'ul shaxs";
    const address = item.address || `${city}, O'zbekiston`;
    const rating = item.rating || 4.9;
    const reviewsCount = item.reviews || (item.reviewsList ? item.reviewsList.length : 0);
    const desc = item.desc || "Batafsil ma'lumot kiritilmagan.";
    const amenities = item.amenities || [item.tag || item.category || "Qulay joylashuv"];
    const gMapsUrl = item.googleMapsUrl || `https://maps.google.com/?q=${item.coordinates ? item.coordinates.join(",") : ""}`;

    slideImages = (item.images && item.images.length) ? item.images : [item.image];

    const sliderHtml = `
      <div class="slider-container">
        ${slideImages.map((imgUrl, idx) => `
          <img src="${escapeHtml(imgUrl)}" class="slide-img ${idx === 0 ? 'active' : ''}" alt="${escapeHtml(title)} - rasm ${idx+1}">
        `).join("")}
        ${slideImages.length > 1 ? `
          <button class="slider-btn prev" onclick="changeSlide(currentSlide - 1)">❮</button>
          <button class="slider-btn next" onclick="changeSlide(currentSlide + 1)">❯</button>
          <div class="slider-dots">
            ${slideImages.map((_, idx) => `<span class="slider-dot ${idx === 0 ? 'active' : ''}" onclick="changeSlide(${idx})"></span>`).join("")}
          </div>
        ` : ''}
      </div>
    `;

    // Fetch backend reviews for this item
    let fetchedReviews = [];
    try {
      const revRes = await fetch(`${API}/api/reviews?targetType=${itemType}&targetId=${itemId}`);
      const revData = await revRes.json();
      if (revData.ok) fetchedReviews = revData.reviews || [];
    } catch (e) {
      console.warn("Could not fetch API reviews for item", e);
    }

    const session = window.SafarSession ? window.SafarSession.getSession() : null;

    // Combine static reviewsList and fetched API reviews
    const combinedReviews = [...fetchedReviews];
    (item.reviewsList || []).forEach(sr => {
      if (!combinedReviews.some(fr => fr.text === sr.text && fr.userName === sr.name)) {
        combinedReviews.push({
          id: null,
          userName: sr.name,
          rating: sr.rating,
          createdAt: sr.date,
          text: sr.text
        });
      }
    });

    // Sort 5/5 stars first
    combinedReviews.sort((a, b) => {
      if (b.rating !== a.rating) return b.rating - a.rating;
      return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
    });

    const isAdmin = session && (session.user.role === "admin" || (session.user.email || "").toLowerCase() === "abdulquddusxoshimov777@gmail.com");

    const reviewsHtml = combinedReviews.map(r => {
      const canManageRev = session && r.id && (
        isAdmin ||
        (r.userId && String(r.userId) === String(session.user.id)) ||
        (r.userEmail && r.userEmail.toLowerCase() === (session.user.email || "").toLowerCase())
      );
      
      const safeRevText = (r.text || "").replace(/\\/g, "\\\\").replace(/`/g, "\\`").replace(/\$/g, "\\$").replace(/"/g, "&quot;");
      const editBtn = canManageRev ? `<button type="button" class="btn-edit-review" onclick="editReviewItem('${r.id}', \`${safeRevText}\`, ${r.rating})" title="Sharhni tahrirlash" style="margin-left:8px; font-size:12px; background:rgba(20,32,56,0.08); color:var(--indigo); border:none; border-radius:6px; padding:2px 8px; cursor:pointer; font-weight:700;">✏️ Tahrirlash</button>` : '';
      const deleteBtn = canManageRev ? `<button type="button" class="btn-delete-review" onclick="deleteReview('${r.id}')" title="Sharhni o'chirish" style="margin-left:6px; font-size:12px; background:rgba(193,101,47,0.12); color:var(--clay); border:none; border-radius:6px; padding:2px 8px; cursor:pointer;">🗑 O'chirish</button>` : '';

      return `
      <div class="review-item" id="review-item-${r.id || Math.random().toString(36).slice(2)}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:6px;">
          <div style="display:flex; align-items:center; flex-wrap:wrap;">
            <a href="profile.html?id=${encodeURIComponent(r.userId || r.userEmail || r.userName || '')}" style="color:inherit; text-decoration:none; font-weight:700;" title="Foydalanuvchi profilini ko'rish">${escapeHtml(r.userName || r.name)}</a>
            ${editBtn}
            ${deleteBtn}
          </div>
          <span style="color:var(--gold); font-weight:700;">★ ${r.rating}</span>
        </div>
        <p style="font-size:14px; margin-bottom:4px;">${escapeHtml(r.text)}</p>
        <small style="color:rgba(0,0,0,0.5)">${escapeHtml(r.createdAt ? new Date(r.createdAt).toLocaleDateString("en-GB") : (r.date || ""))}</small>
      </div>
    `;
    }).join("");

    const isListingOwner = session && (
      isAdmin ||
      (item.ownerId && String(item.ownerId) === String(session.user.id)) ||
      (item.ownerEmail && (item.ownerEmail || "").toLowerCase() === (session.user.email || "").toLowerCase()) ||
      (!item.ownerId && !item.ownerEmail && item.ownerName && item.ownerName.toLowerCase() === (session.user.name || "").toLowerCase())
    );

    container.innerHTML = `
      <div style="margin-bottom:20px;">
        <a href="javascript:history.back()" style="text-decoration:none; font-weight:600; color:var(--clay);">← Orqaga qaytish</a>
      </div>

      ${sliderHtml}

      <div class="detail-grid">
        <div>
          <span class="eyebrow" style="text-transform:uppercase;">${escapeHtml(item.tag || item.category || "Safar")} · ${escapeHtml(city)}</span>
          <h1 style="margin:8px 0 12px; font-size:32px;">${escapeHtml(title)}</h1>
          
          <div style="display:flex; gap:16px; align-items:center; margin-bottom:24px; flex-wrap:wrap;">
            <span style="font-weight:700; color:var(--gold); font-size:18px;">★ ${rating}</span>
            <span style="color:rgba(0,0,0,0.6); font-weight:600;">(${reviewsCount} ta sharh)</span>
            <span style="color:rgba(0,0,0,0.6)">📍 ${escapeHtml(address)}</span>
          </div>

          <h3 style="margin-bottom:10px; font-family:var(--font-display);">Tavsif va ma'lumotlar</h3>
          <p style="font-size:16px; line-height:1.7; color:rgba(28,26,23,0.85); margin-bottom:28px;">
            ${escapeHtml(desc)}
          </p>

          <!-- QULAYLIKLAR VA IMKONYATLAR (Image 3 match) -->
          <h3 style="margin-bottom:12px; font-family:var(--font-display); font-size:22px;">Qulayliklar va Imkoniyatlar</h3>
          <div class="amenities-list" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:32px;">
            ${amenities.map(a => `
              <span class="amenity-chip" style="background:#fff; border:1px solid var(--sand-dark); padding:8px 18px; border-radius:24px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(0,0,0,0.03);">
                ✓ ${escapeHtml(a)}
              </span>
            `).join("")}
          </div>

          <!-- APP INTERACTIVE MAP -->
          <h3 style="margin-bottom:12px; font-family:var(--font-display); font-size:22px;">📍 Joylashuv xaritasi</h3>
          <div id="detailMapMount" style="width:100%; height:320px; border-radius:16px; border:1px solid var(--sand-dark); margin-bottom:32px; overflow:hidden;"></div>

          <div class="reviews-box">
            <h3 style="margin-bottom:16px;">Ushbu joy bo'yicha sharh qoldirish</h3>
            
            <div class="add-review-form">
              <form id="itemReviewForm">
                <div style="margin-bottom:14px;">
                  <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(28,26,23,0.6); margin-bottom: 6px;">BAHO</div>
                  <div class="star-picker" id="detailStarPicker">
                    <span class="star active" data-v="1" role="button" aria-label="1 star">★</span>
                    <span class="star active" data-v="2" role="button" aria-label="2 stars">★</span>
                    <span class="star active" data-v="3" role="button" aria-label="3 stars">★</span>
                    <span class="star active" data-v="4" role="button" aria-label="4 stars">★</span>
                    <span class="star active" data-v="5" role="button" aria-label="5 stars">★</span>
                  </div>
                  <input type="hidden" id="itemRating" value="5">
                </div>
                <div style="margin-bottom:12px;">
                  <textarea id="itemReviewText" rows="3" placeholder="Ushbu mehmoxona/joy haqida o'z tajribangizni yozing..." style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--sand-dark); font-family:inherit;" required></textarea>
                </div>
                <div id="reviewAlert" style="color:var(--clay); font-size:13px; margin-bottom:8px; display:none;"></div>
                <button type="submit" class="btn btn-primary" style="font-size:14px; padding:10px 20px;">Sharhni joylash</button>
              </form>
            </div>

            <h4 style="margin-bottom:16px;">Mijozlar sharhlari (Otzivlar)</h4>
            <div id="itemReviewsContainer">
              ${reviewsHtml || '<p style="color:rgba(0,0,0,0.5)">Hozircha sharhlar yo\'q. Birinchi bo\'lib sharh qoldiring!</p>'}
            </div>
          </div>
        </div>

        <div>
          <div class="host-card">
            <h3>Bog'lanish va Bron qilish</h3>
            <p style="font-size:14.5px; color:rgba(28,26,23,0.8);">
              <strong>Egasi / Mas'ul:</strong> <a href="profile.html?id=${encodeURIComponent(item.ownerId || item.ownerEmail || ownerName)}" style="color:var(--indigo); font-weight:700; text-decoration:none;" title="Egasi profilini ko'rish">${escapeHtml(ownerName)} ↗</a>
            </p>
            
            <div>
              <div style="font-size:12px; text-transform:uppercase; font-weight:700; color:rgba(0,0,0,0.5); margin-bottom:6px;">Telefon raqami:</div>
              <a href="tel:${escapeHtml(phone)}" class="phone-badge">
                📞 ${escapeHtml(phone)}
              </a>
            </div>

            ${item.price ? `<div style="font-size:22px; font-weight:800; margin-top:8px;">${escapeHtml(String(item.price))} <span style="font-size:14px; font-weight:400; color:rgba(0,0,0,0.6);">/ bahosi</span></div>` : ""}

            <a href="${escapeHtml(gMapsUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost" style="text-align:center; margin-top:8px;">
              📍 Google Maps / Yandex Maps da ochish
            </a>

            ${isListingOwner ? `
              <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
                <button type="button" class="btn btn-ghost" style="width:100%; justify-content:center; border-radius:10px; font-weight:700;" onclick="openEditListingModal('${itemType}s', ${item.id})">
                  ✏️ ${isAdmin ? "Admin: E'lonni tahrirlash" : "E'lonni tahrirlash"}
                </button>
                <button type="button" class="btn-delete-listing" style="width:100%; justify-content:center; background:rgba(193,101,47,0.12); color:var(--clay); border:none; padding:10px; border-radius:10px; font-weight:700; cursor:pointer;" onclick="deleteListing('${itemType}s', ${item.id})">
                  🗑 ${isAdmin ? "Admin sifatida e'lonni o'chirish" : "Ushbu e'lonni o'chirish"}
                </button>
              </div>
            ` : ""}
          </div>
        </div>
      </div>
    `;

    setupTouchAndAutoSlide();

    // Initialize Leaflet Map on Detail Page for Item Coordinates
    if (window.L && item.coordinates) {
      const mapEl = document.getElementById("detailMapMount");
      if (mapEl) {
        const dMap = L.map("detailMapMount").setView(item.coordinates, 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19
        }).addTo(dMap);
        L.marker(item.coordinates).addTo(dMap).bindPopup(`<b>${escapeHtml(title)}</b><br>${escapeHtml(address)}`).openPopup();
        setTimeout(() => dMap.invalidateSize(), 400);
      }
    }


    // Star picker interactive logic for detail page
    let selectedRating = 5;
    const detailStars = document.querySelectorAll("#detailStarPicker .star");
    detailStars.forEach(s => {
      s.onclick = () => {
        selectedRating = parseInt(s.dataset.v);
        document.getElementById("itemRating").value = selectedRating;
        detailStars.forEach((x, i) => x.classList.toggle("active", i < selectedRating));
      };
    });

    // Handle Edit Review logic
    window.editReviewItem = function(revId, currentText, currentRating) {
      if (window.openEditReviewModal) {
        window.openEditReviewModal(revId, currentText, currentRating, () => {
          loadDetail();
        });
      }
    };

    // Handle Delete Review logic
    window.deleteReview = async function(revId) {
      const sessionObj = window.SafarSession ? window.SafarSession.getSession() : null;
      if (!sessionObj) return window.safarAlert({ title: "Diqqat", message: "Avval tizimga kiring.", icon: "🔒" });

      const confirmed = await window.safarConfirm({
        title: "Sharhni o'chirish",
        message: "Ushbu sharhni o'chirishni tasdiqlaysizmi?",
        icon: "🗑",
        confirmText: "Ha, o'chirish",
        cancelText: "Bekor qilish",
        danger: true
      });
      if (!confirmed) return;

      try {
        const res = await fetch(`${API}/api/reviews/${revId}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${sessionObj.token}` }
        });
        const dData = await res.json();
        if (dData.ok) {
          await window.safarAlert({ title: "O'chirildi", message: "Sharh muvaffaqiyatli o'chirildi.", icon: "✅" });
          loadDetail();
        } else {
          await window.safarAlert({ title: "Xatolik", message: dData.message || "Sharhni o'chirishda xatolik.", icon: "⚠️" });
        }
      } catch (err) {
        await window.safarAlert({ title: "Xatolik", message: "Server bilan bog'lanishda xatolik.", icon: "❌" });
      }
    };

    // Handle Item Review Form Submission
    const reviewForm = document.getElementById("itemReviewForm");
    reviewForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("safar_token");
      const alertBox = document.getElementById("reviewAlert");
      alertBox.style.display = "none";

      if (!token) {
        alertBox.textContent = "Sharh qoldirish uchun avval tizimga kiring (Log in).";
        alertBox.style.display = "block";
        return;
      }

      const text = document.getElementById("itemReviewText").value.trim();
      const rating = parseInt(document.getElementById("itemRating").value);

      if (!text) return;

      try {
        const res = await fetch(`${API}/api/reviews`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({
            text,
            rating,
            targetType: itemType,
            targetId: itemId,
            location: city,
            stayTitle: title
          })
        });
        const rData = await res.json();

        if (!rData.ok) {
          alertBox.textContent = rData.message || "Xatolik yuz berdi.";
          alertBox.style.display = "block";
        } else {
          reviewForm.reset();
          selectedRating = 5;
          detailStars.forEach(x => x.classList.add("active"));
          document.getElementById("itemRating").value = 5;
          loadDetail();
        }
      } catch(err) {
        alertBox.textContent = "Server bilan bog'lanishda xatolik.";
        alertBox.style.display = "block";
      }
    });

  } catch(e) {
    console.error(e);
    container.innerHTML = `<p>Ma'lumotlarni yuklashda xatolik yuz berdi. Backend server ishlayotganiga ishonch hosil qiling.</p>`;
  }
