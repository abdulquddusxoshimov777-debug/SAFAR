<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foydalanuvchi Profili — Safar</title>
  <meta name="description" content="Safar platformasidagi foydalanuvchi profili va uning joylagan e'lonlari.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2.2">
  <style>
    .profile-hero {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
      margin-top: 24px;
      box-shadow: var(--shadow-card);
      display: flex;
      gap: 28px;
      align-items: center;
      flex-wrap: wrap;
    }
    .profile-avatar-wrap {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--sand-deep);
      border: 3px solid var(--line-soft);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: var(--indigo);
    }
    .profile-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-info {
      flex: 1;
      min-width: 240px;
    }
    .profile-name {
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--indigo);
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .profile-role-badge {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(22, 35, 63, 0.08);
      color: var(--indigo);
    }
    .profile-role-badge.admin {
      background: rgba(200, 93, 40, 0.14);
      color: var(--clay);
    }
    .profile-role-badge.host {
      background: rgba(0, 150, 136, 0.14);
      color: #00796b;
    }
    .profile-meta {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      font-size: 14px;
      color: rgba(28, 26, 23, 0.7);
      flex-wrap: wrap;
    }
    .profile-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .profile-stats-row {
      display: flex;
      gap: 16px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .profile-stat-box {
      background: var(--sand-light);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profile-stat-box strong {
      font-size: 18px;
      color: var(--indigo);
    }
    .profile-stat-box span {
      font-size: 12.5px;
      color: rgba(28, 26, 23, 0.7);
    }
    @media (max-width: 600px) {
      .profile-hero { padding: 20px; gap: 16px; }
      .profile-avatar-wrap { width: 80px; height: 80px; font-size: 28px; }
      .profile-name { font-size: 22px; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>

<main style="padding-bottom:70px;">
  <div class="container">
    <div style="margin-top:20px;">
      <a href="javascript:history.back()" style="display:inline-flex; align-items:center; gap:6px; color:var(--clay); text-decoration:none; font-weight:700; font-size:14px;">
        ← Orqaga
      </a>
    </div>

    <div class="profile-hero" id="profileHero">
      <div class="profile-avatar-wrap" id="profileAvatar">👤</div>
      <div class="profile-info">
        <h1 class="profile-name">
          <span id="profileName">Yuklanmoqda...</span>
          <span class="profile-role-badge" id="profileRoleBadge">—</span>
        </h1>
        <div class="profile-meta">
          <div class="profile-meta-item">
            <span>📅</span>
            <span>A'zo bo'lgan: <strong id="profileSince">—</strong></span>
          </div>
        </div>
        <div id="profileBioBox" style="margin-top:12px; font-size:14.5px; color:rgba(28,26,23,0.85); line-height:1.6; background:rgba(255,255,255,0.7); padding:10px 14px; border-radius:10px; border-left:3px solid var(--clay); display:none;">
          <span style="font-weight:700; color:var(--indigo); margin-right:6px;">✍️ Bio:</span><span id="profileBioText"></span>
        </div>
        <div class="profile-stats-row">
          <div class="profile-stat-box">
            <span>📋</span>
            <div>
              <strong id="statListingsCount">0</strong>
              <div><span>E'lonlar</span></div>
            </div>
          </div>
          <div class="profile-stat-box">
            <span>💬</span>
            <div>
              <strong id="statReviewsCount">0</strong>
              <div><span>Sharhlar</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- USER'S LISTINGS SECTION -->
    <div style="margin-top:36px;">
      <div class="section-head" style="margin-bottom:20px;">
        <div>
          <span class="eyebrow">Muallif e'lonlari</span>
          <h2 id="listingsSectionTitle" style="font-family:var(--font-display); font-size:24px; color:var(--indigo); margin-top:4px;">
            Joylashtirilgan barcha e'lonlar
          </h2>
        </div>
      </div>

      <div id="userListingsContainer" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px;">
        <div class="review-skeleton-card"></div>
        <div class="review-skeleton-card"></div>
        <div class="review-skeleton-card"></div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/partials.js"></script>
<script src="js/i18n.js"></script>
<script>
(function() {
  const API = window.SAFAR_API_BASE || (location.protocol === "file:" ? "http://localhost:4000" : "");
  const params = new URLSearchParams(location.search);
  const userId = params.get("id") || params.get("user");

  function escapeHtml(str) {
    if (!str) return "";
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function getInitials(name) {
    return (name || "?").trim().split(/\\s+/).slice(0, 2).map(p => p[0]?.toUpperCase()).join("");
  }

  async function loadProfile() {
    if (!userId) {
      document.getElementById("profileName").textContent = "Foydalanuvchi topilmadi";
      document.getElementById("userListingsContainer").innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px;">Foydalanuvchi ID parametri ko`rsatilmagan.</div>';
      return;
    }

    try {
      const res = await fetch(`${API}/api/users/${encodeURIComponent(userId)}/profile`);
      const data = await res.json();

      if (!data.ok) {
        document.getElementById("profileName").textContent = "Foydalanuvchi topilmadi";
        document.getElementById("userListingsContainer").innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px;">${escapeHtml(data.message || "Foydalanuvchi mavjud emas.")}</div>`;
        return;
      }

      const u = data.user;
      const listings = data.listings || [];
      const reviewsCount = data.reviewsCount || 0;

      // Fill header
      document.getElementById("profileName").textContent = u.name || "Noma'lum foydalanuvchi";
      document.title = `${u.name} — Safar Profili`;

      const avatarBox = document.getElementById("profileAvatar");
      if (u.avatarUrl) {
        avatarBox.innerHTML = `<img src="${escapeHtml(u.avatarUrl)}" alt="${escapeHtml(u.name)}">`;
      } else {
        avatarBox.textContent = getInitials(u.name);
      }

      const roleBadge = document.getElementById("profileRoleBadge");
      const isAdmin = u.role === "admin" || (u.email && u.email.toLowerCase() === "abdulquddusxoshimov777@gmail.com");
      if (isAdmin) {
        roleBadge.className = "profile-role-badge admin";
        roleBadge.textContent = "👑 Bosh Administrator";
      } else if (u.role === "host") {
        roleBadge.className = "profile-role-badge host";
        roleBadge.textContent = "🏠 Mezbon (Host)";
      } else {
        roleBadge.className = "profile-role-badge";
        roleBadge.textContent = "✈️ Sayohatchi (Tourist)";
      }

      document.getElementById("profileSince").textContent = u.createdAt
        ? new Date(u.createdAt).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })
        : "Platforma a'zosi";

      const bioBox = document.getElementById("profileBioBox");
      const bioText = document.getElementById("profileBioText");
      if (u.bio && u.bio.trim()) {
        bioText.textContent = u.bio.trim();
        bioBox.style.display = "block";
      } else {
        bioBox.style.display = "none";
      }

      document.getElementById("statListingsCount").textContent = listings.length;
      document.getElementById("statReviewsCount").textContent = reviewsCount;
      document.getElementById("listingsSectionTitle").textContent = `${u.name} tomonidan qo'shilgan e'lonlar (${listings.length})`;

      // Render Listings
      const container = document.getElementById("userListingsContainer");
      if (!listings.length) {
        container.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:48px 20px; background:var(--sand-light); border-radius:16px;">
            <div style="font-size:40px; margin-bottom:10px;">🏠</div>
            <h4 style="font-size:18px; margin-bottom:6px; color:var(--indigo);">Hozircha e'lonlar yo'q</h4>
            <p style="color:rgba(28,26,23,0.65); font-size:14px;">Ushbu foydalanuvchi hozircha birorta ham e'lon joylamagan.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = listings.map(item => {
        const cat = item.categoryType || "stays";
        const singleType = cat === "places" ? "place" : (cat === "foods" ? "food" : (cat === "crafts" ? "craft" : "stay"));
        const detailUrl = `detail.html?type=${singleType}&id=${item.id}`;
        const itemImg = item.image || (Array.isArray(item.images) && item.images[0]) || "https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80";
        return `
          <div class="stay-card" style="display:flex; flex-direction:column; padding:0; overflow:hidden; border:1px solid var(--line-soft);">
            <div class="stay-thumb" style="height:180px; border-radius:0;">
              <img src="${escapeHtml(itemImg)}" alt="${escapeHtml(item.title)}" loading="lazy">
              <span class="badge-super" style="text-transform:uppercase;">${escapeHtml(item.tag || catBadge)}</span>
            </div>
            <div class="stay-body" style="padding:16px; flex:1; display:flex; flex-direction:column;">
              <div class="stay-loc" style="text-transform:uppercase; font-size:11px; color:var(--clay); font-weight:700;">${escapeHtml(item.city)}</div>
              <h4 style="font-size:16px; margin:6px 0 10px; font-family:var(--font-display); line-height:1.3; color:var(--ink);">${escapeHtml(item.title)}</h4>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:12px; border-top:1px solid rgba(28,26,23,0.08);">
                <strong style="font-size:15px; color:var(--ink);">${escapeHtml(String(item.price))}</strong>
                <a href="${detailUrl}" class="btn-detail" style="padding:6px 14px; font-size:12.5px; border-radius:8px; text-decoration:none;">🔍 Ko'rish</a>
              </div>
            </div>
          </div>
        `;
      }).join("");

    } catch(err) {
      console.error("Profile load error:", err);
      document.getElementById("userListingsContainer").innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px;">Server bilan boglanishda xatolik yuz berdi.</div>';
    }
  }

  loadProfile();
})();
</script>
</body>
</html>
